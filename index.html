<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>k-i18n Schema Builder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .submission {
            margin-top: 20px;
        }

        option:disabled {
            display: none;
        }
    </style>
</head>

<body>
    <div class="container py-4">
            <div class="row g-2 align-items-center mb-3">
                <form id="key-form" class="col input-group" spellcheck="false">
                    <input id="key-name" type="text" class="form-control" placeholder="Key Name" aria-label="Key name" />

                    <select id="translation-type" class="form-select" style="max-width:180px;" aria-label="Translation type">
                        <option disabled selected value>Select type</option>
                        <option value="basic">Basic</option>
                        <option value="variable">Variable</option>
                        <option value="plural">Plural</option>
                        <option value="contextual">Contextual</option>
                    </select>

                    <span class="input-group-text" title="Required">
                        <label for="required" class="m-0 me-1">Req:</label>
                        <input id="required" class="form-check-input m-0" type="checkbox" checked aria-label="Required" />
                    </span>

                    <button id="add-key" type="submit" class="btn btn-primary" title="Add key"><i class="bi bi-plus"></i></button>
                </form>
                <div class="col flex-grow-1"></div>
                <div class="col input-group">
                    <select id="locale-select" class="form-select form-select" style="max-width:180px;" aria-label="Select locale">
                    </select>
                    <button id="edit-locale-modal-button" type="button" class="btn btn-outline-secondary form-control">Edit Locales</button>
                </div>
            </div>

            <div id="translation-container" class="mt-3"></div>
    </div>
    <!-- Locales modal -->
    <div class="modal fade" id="localeModal" tabindex="-1" aria-labelledby="localeModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="localeModalLabel">Manage Locales</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="locale-code-input" class="form-label">Locale code</label>
                        <input id="locale-code-input" class="form-control" placeholder="e.g. en, fr, es" />
                    </div>
                    <div class="mb-3">
                        <label for="locale-name-input" class="form-label">Display name (optional)</label>
                        <input id="locale-name-input" class="form-control" placeholder="e.g. English, Français" />
                    </div>
                    <div class="d-flex gap-2 mb-3">
                        <button id="save-locale-button" type="button" class="btn btn-primary ms-auto me-auto">Add locale</button>
                    </div>

                    <div>
                        <h6 class="mb-2">Locales</h6>
                        <ul id="locale-list" class="list-group">
                            <!-- locales will be rendered here -->
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
<script src="src/builder.ts" type="module"></script>
</html>
